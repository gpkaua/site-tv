backend:
    name: git-gateway
    repo: gpkaua/site-tv

media_folder: "content/images"
public_folder: "/content/images"

collections:
    - name: "noticias"
      label: "Notícias"
      folder: "content/noticias"
      create: true
      fields:
        - { label: "Título", name: "title", type: "string", required: true }
        - { label: "Resumo", name: "summary", type: "text" }